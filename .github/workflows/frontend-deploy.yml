name: Deploy Frontend (Static)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          VITE_API_URL=https://api.unifiedcalendarview.com/api npm run build
          cd ..
          mv frontend/dist frontend-dist

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.GOOGLE_VM_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          rsync -az --delete \
          frontend-dist/ \
          tanay@34.187.241.217:/var/www/calendar-sync-app/frontend/dist
