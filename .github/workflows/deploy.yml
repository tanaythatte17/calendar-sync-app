name: Deploy Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # ------------------------
      # Backend build & push
      # ------------------------
      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/calendar-backend:latest \
            ./backend

      - name: Push backend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/calendar-backend:latest

      # ------------------------
      # Frontend build & push
      # ------------------------
      - name: Build frontend image
        run: |
          docker build \
            --build-arg APP_API_URL="https://api.unifiedcalendarview.com/api" \
            --build-arg APP_ENV="production" \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/calendar-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/calendar-frontend:latest
