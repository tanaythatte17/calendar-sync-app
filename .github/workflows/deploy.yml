name: Deploy Docker Images (GHCR)

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # ------------------------
      # Login to GitHub Container Registry
      # ------------------------
      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      # ------------------------
      # Backend build & push
      # ------------------------
      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/${{ secrets.GHCR_USERNAME }}/calendar-backend:latest \
            ./backend

      - name: Push backend image
        run: docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/calendar-backend:latest

      # ------------------------
      # Frontend build & push
      # ------------------------
      - name: Build frontend image
        run: |
          docker build \
            --build-arg APP_API_URL="https://api.unifiedcalendarview.com/api" \
            --build-arg APP_ENV="production" \
            -t ghcr.io/${{ secrets.GHCR_USERNAME }}/calendar-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: docker push ghcr.io/${{ secrets.GHCR_USERNAME }}/calendar-frontend:latest
