name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.GOOGLE_VM_PRIVATE_KEY }}

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no tanay@35.233.159.215 << 'EOF'
            cd /var/www/calendar-sync-app

            # Reset repo to latest main
            git fetch --all
            git reset --hard origin/main

            # Frontend build
            cd frontend
            npm ci
            npm run build

            # Backend build
            cd ../backend
            npm ci

            # Restart backend (use sudo only for this command if needed)
            sudo pm2 restart project-backend || sudo pm2 start server.js --name project-backend
            sudo pm2 save
          EOF
