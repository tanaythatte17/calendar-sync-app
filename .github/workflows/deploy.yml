name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.GOOGLE_VM_PRIVATE_KEY }}

      # ✅ Inject .env file before building frontend
      - name: Create frontend .env
        run: |
          cat <<EOF > frontend/.env
          VITE_API_URL=${{ secrets.FRONTEND_API_URL }}
          EOF

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..
          mv frontend/dist frontend-dist

      - name: Rsync frontend build to VPS
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" frontend-dist/ tanay@35.233.159.215:/var/www/calendar-sync-app/frontend/dist

      - name: Rsync backend to VPS
        run: |
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" backend/ tanay@35.233.159.215:/var/www/calendar-sync-app/backend

      - name: Restart backend
        run: |
          ssh -o StrictHostKeyChecking=no tanay@35.233.159.215 << 'EOF'
            cd /var/www/calendar-sync-app/backend
            npm ci
            sudo pm2 restart project-backend || sudo pm2 start server.js --name project-backend
            sudo pm2 save
          EOF