version: '3.8'

services:
  backend-1:
    container_name: calendar-backend-1
    image: tanaythatte17/calendar-backend:latest
    restart: always
    env_file:
      - ./backend/.env
    ports:
      - "3001:3000"    # Backend #1 available at localhost:3001
    networks:
      - calendar-net

  frontend:
    container_name: calendar-frontend
    image: tanaythatte17/calendar-frontend:latest
    restart: always
    ports:
      - "8080:80"       # Public frontend on port 8080
    networks:
      - calendar-net

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      --interval 300
      --cleanup
      calendar-backend-1
      calendar-frontend

networks:
  calendar-net:
    driver: bridge